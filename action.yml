name: 'GhostRoute Zombie Cloud & Dangling DNS Hunter'
description: 'Sub-second, zero-cost static Terraform state auditor for unattached cloud resources and subdomain takeovers.'
author: 'GhostRoute Contributors'
branding:
  icon: 'shield'
  color: 'purple'

inputs:
  state_file:
    description: 'Path to terraform.tfstate file'
    required: false
    default: 'terraform.tfstate'
  format:
    description: 'Output format: tui, sarif, json'
    required: false
    default: 'sarif'
  output:
    description: 'Output file path (e.g. ghostroute-report.sarif)'
    required: false
    default: 'ghostroute-report.sarif'
  prune_file:
    description: 'Generate safe terraform state rm script path'
    required: false
    default: ''
  fail_on_critical:
    description: 'Fail CI/CD job if critical or high vulnerabilities are detected'
    required: false
    default: 'true'
  demo:
    description: 'Run against built-in demo vulnerable cloud fixture'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Run GhostRoute Scan
      shell: bash
      run: |
        ARGS=""
        if [ "${{ inputs.demo }}" = "true" ]; then
          ARGS="--demo"
        else
          ARGS="--state ${{ inputs.state_file }}"
        fi

        if [ -n "${{ inputs.format }}" ]; then
          ARGS="$ARGS --format ${{ inputs.format }}"
        fi

        if [ -n "${{ inputs.output }}" ]; then
          ARGS="$ARGS --output ${{ inputs.output }}"
        fi

        if [ -n "${{ inputs.prune_file }}" ]; then
          ARGS="$ARGS --prune-file ${{ inputs.prune_file }}"
        fi

        if [ "${{ inputs.fail_on_critical }}" = "true" ]; then
          ARGS="$ARGS --fail-on-critical"
        fi

        go run ${{ github.action_path }}/cmd/ghostroute scan $ARGS
